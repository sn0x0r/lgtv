name: Build launcher

on:
  push:
    paths: ['launcher/**', '.github/workflows/build-launcher.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/build-launcher.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check bundle has no ES2020 syntax (webOS 6 runs Chrome 79)
        run: "! grep -E '\\?\\.|\\?\\?' dist/assets/app.js"
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-ipk
          path: launcher/build/*.ipk
